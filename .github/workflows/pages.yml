name: Deploy Pages (production + redesign preview)

on:
  push:
    branches: [master, redesign]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master (production)
        uses: actions/checkout@v4
        with:
          ref: master
          path: production

      - name: Checkout redesign (preview)
        uses: actions/checkout@v4
        with:
          ref: redesign
          path: redesign-src

      # The preview must live under /redesign, so its build needs that baseurl.
      - name: Set preview baseurl
        run: |
          sed -i 's|^baseurl:.*|baseurl: "/redesign"|' redesign-src/_config.yml

      - name: Build production site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./production
          destination: ./_site

      - name: Build redesign preview
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./redesign-src
          destination: ./_site/redesign

      - name: Upload combined artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
